<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>次品管理 · 质量预警 · 统一监控与交接中心</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20261014a">
  <style>
    /* 次品管理 · 数据范围 / 工序筛选专属样式，不污染全局 style.css */
    .dp-scope{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 10px;padding:10px 12px;border:1px dashed var(--border,#e1e7f0);border-radius:10px;background:var(--bg,#f2f5fa)}
    .dp-scope-lbl{font-size:13px;font-weight:600;color:var(--text-2,#475569);white-space:nowrap}
    .dp-scope .seg{box-shadow:none}
    .dp-scope-hint{font-size:12.5px;color:var(--text-3,#64748b)}
    .dp-note{font-size:12.5px;color:var(--text-2,#475569);line-height:1.7;margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--primary,#2563eb);background:rgba(37,99,235,.06);border-radius:0 8px 8px 0}
    .dp-note b{color:var(--text,#1f2937)}
    /* 四级 · 料号跨机台分析：并排两图（柱状 PPM + 环形次品占比）专属样式 */
    .l4-2col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:2px 0 14px}
    @media (max-width:1080px){.l4-2col{grid-template-columns:1fr}}
    .l4-box{border:1px solid var(--border,#e1e7f0);border-radius:10px;padding:9px 12px 6px;background:#fff}
    .l4-box-hd{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text,#1f2937);
      padding-bottom:6px;margin-bottom:2px;border-bottom:1px dashed var(--border,#e1e7f0)}
    .l4-box-hd svg{color:var(--primary,#2563eb);flex:0 0 auto}
    .l4-box-sub{font-weight:400;font-size:11.5px;color:var(--text-3,#64748b);margin-left:auto;text-align:right}
    @media (max-width:640px){.l4-box-sub{display:none}}
  </style>
</head>
<body data-page="defect">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>
</div>
<script src="assets/js/common.js?v=20261015c"></script>
<script src="assets/js/data.js?v=20261008r"></script>
<script src="assets/js/defect-real-data.js?v=20261014a"></script>
<script src="assets/js/device-events.js?v=20261009a"></script>
<script src="assets/js/page-defect.js?v=20261014f"></script>
</body>
</html>
