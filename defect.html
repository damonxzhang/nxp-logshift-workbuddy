<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>次品管理 · 质量预警 · 统一监控与交接中心</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20261008r">
  <style>
    /* 次品管理 · 数据范围（部门筛选）专属样式，不污染全局 style.css */
    .dp-scope{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 14px;padding:10px 12px;border:1px dashed var(--border,#e1e7f0);border-radius:10px;background:var(--bg,#f2f5fa)}
    .dp-scope-lbl{font-size:13px;font-weight:600;color:var(--text-2,#475569);white-space:nowrap}
    .dp-scope .seg{box-shadow:none}
    .dp-scope-hint{font-size:12.5px;color:var(--text-3,#64748b)}
    /* 一级展现形式 3：小倍数趋势矩阵（Small Multiples）专属样式 */
    .dp-sms{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
    .dp-sm{border:1px solid var(--border,#e1e7f0);border-radius:10px;padding:8px 10px 7px;background:#fff;cursor:pointer;
      transition:transform .12s,border-color .12s,box-shadow .12s}
    .dp-sm:hover{border-color:var(--primary,#2563eb);transform:translateY(-2px);box-shadow:0 6px 16px rgba(37,99,235,.13)}
    .dp-sm.off{opacity:.36}
    .dp-sm-hd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text,#1f2937);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dp-sm-hd i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
    .dp-sm-svg{display:block;width:100%;height:36px;margin:5px 0 3px;overflow:visible}
    .dp-sm-ft{display:flex;align-items:baseline;justify-content:space-between;gap:6px;font-size:11px;color:var(--text-3,#64748b)}
    .dp-sm-ft b{font-size:16px;font-weight:800;line-height:1}
    /* 四级 · 料号跨机台分析：并排两图（柱状 PPM + 环形次品占比）专属样式 */
    .l4-2col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:2px 0 14px}
    @media (max-width:1080px){.l4-2col{grid-template-columns:1fr}}
    .l4-box{border:1px solid var(--border,#e1e7f0);border-radius:10px;padding:9px 12px 6px;background:#fff}
    .l4-box-hd{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text,#1f2937);
      padding-bottom:6px;margin-bottom:2px;border-bottom:1px dashed var(--border,#e1e7f0)}
    .l4-box-hd svg{color:var(--primary,#2563eb);flex:0 0 auto}
    .l4-box-sub{font-weight:400;font-size:11.5px;color:var(--text-3,#64748b);margin-left:auto;text-align:right}
    @media (max-width:640px){.l4-box-sub{display:none}}
  </style>
</head>
<body data-page="defect">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>
</div>
<script src="assets/js/common.js?v=20261013c"></script>
<script src="assets/js/data.js?v=20261008r"></script>
<script src="assets/js/defect-real-data.js?v=20261009a"></script>
<script src="assets/js/device-events.js?v=20261009a"></script>
<script src="assets/js/page-defect.js?v=20261013h"></script>
</body>
</html>
