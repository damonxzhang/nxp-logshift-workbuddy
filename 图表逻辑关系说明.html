<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图表逻辑关系说明 · NXP OneBE 交接演示</title>
<style>
:root{
  --bg:#eef2f8; --bg2:#f8fafd; --surface:#fff; --surface-2:#f6f9fd;
  --border:#e3e8f0; --border-strong:#cfd8e6;
  --text:#16202e; --text-2:#4a5567; --text-3:#8a95a5;
  --primary:#1d4ed8; --primary-soft:#e7eeff; --primary-ink:#1b3fa8;
  --success:#12805a; --success-soft:#e3f6ee;
  --warn:#a8620b; --warn-soft:#fdf1e0;
  --danger:#cc2f2a; --danger-soft:#fdecea;
  --teal:#0b6a86; --teal-soft:#e2f3f9;
  --purple:#8b5cf6; --purple-soft:#f1ebfe;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,"Courier New",monospace;
  --shadow:0 1px 2px rgba(16,32,64,.04),0 10px 26px -14px rgba(16,32,64,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.72 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.2px}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
code,.num{font-variant-numeric:tabular-nums}

/* ---------------- 顶栏 ---------------- */
.topbar{
  position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-in{max-width:1440px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;font-size:16.5px;font-weight:800}
.brand small{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:0}
.tb-spacer{flex:1}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  border:1px solid var(--border);background:#fff;color:var(--text-2);
  border-radius:9px;padding:6px 11px;font-size:13px;transition:.18s;font-family:inherit;
}
.tbtn:hover{border-color:var(--border-strong);color:var(--text)}
.tbtn.on{background:var(--primary-soft);border-color:#c3d4ff;color:var(--primary);font-weight:700}

/* ---------------- 布局 ---------------- */
.layout{max-width:1440px;margin:0 auto;padding:22px 22px 90px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:28px;align-items:start}
.toc{position:sticky;top:70px;font-size:13.4px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.toc-t{font-size:11.5px;font-weight:800;color:var(--text-3);letter-spacing:1.2px;margin:0 0 9px 10px}
.toc a{display:block;padding:5.5px 10px;border-radius:8px;color:var(--text-2);border-left:2px solid transparent}
.toc a:hover{background:#fff;text-decoration:none;color:var(--text)}
.toc a.sub{padding-left:22px;font-size:12.8px;color:var(--text-3)}
.toc a.on{background:var(--primary-soft);color:var(--primary);font-weight:700;border-left-color:var(--primary)}
@media(max-width:1080px){
  .layout{grid-template-columns:1fr;gap:14px}
  .toc{position:static;max-height:none;display:none}
}

/* ---------------- 排版 ---------------- */
.hero{background:linear-gradient(135deg,#1d4ed8,#0b6a86);color:#fff;border-radius:16px;padding:24px 26px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero h1{font-size:25px;margin-bottom:9px}
.hero p{margin:0;font-size:14px;line-height:1.85;color:#dbe7ff;max-width:960px}
.hero .hl{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.hero .hl span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600}

.sec{margin:34px 0 0;scroll-margin-top:74px}
.sec-h{display:flex;align-items:center;gap:11px;padding-bottom:10px;border-bottom:2px solid var(--border-strong);margin-bottom:6px}
.sec-n{width:29px;height:29px;flex:none;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.sec-h h2{font-size:20px}
.sec-sub{color:var(--text-3);font-size:13.4px;margin:8px 0 0;line-height:1.8}
.sub-h{font-size:15.5px;font-weight:800;margin:26px 0 10px;padding-left:11px;border-left:4px solid var(--primary);scroll-margin-top:74px;display:flex;align-items:center;gap:9px}

p{margin:11px 0}
ul,ol{margin:11px 0;padding-left:22px}
li{margin:5px 0}
.note{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:0 11px 11px 0;padding:12px 15px;margin:14px 0;font-size:13.8px;color:var(--text-2);line-height:1.8}
.note.warn{border-left-color:var(--warn)}
.note.danger{border-left-color:var(--danger)}
.note.ok{border-left-color:var(--success)}
.note b{color:var(--text)}
.formula{
  font-family:var(--mono);font-size:12.6px;line-height:1.9;color:#243049;
  background:var(--surface-2);border:1px solid var(--border);border-left:3px solid #b9c8e4;
  border-radius:0 10px 10px 0;padding:11px 14px;margin:12px 0;white-space:pre;overflow-x:auto;
}
.formula em{font-style:normal;color:var(--text-3)}
.formula b{color:var(--primary-ink)}
table{width:100%;border-collapse:collapse;font-size:13.4px;background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 0 0 1px var(--border);margin:13px 0}
th{background:var(--surface-2);text-align:left;padding:9px 11px;font-weight:700;color:var(--text-2);font-size:12.7px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid #eef2f8;vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.4px;color:var(--primary-ink);background:var(--primary-soft);padding:1px 5px;border-radius:5px;white-space:nowrap}

/* ---------------- 徽标 ---------------- */
.bdg{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2.5px 9px;font-size:11.8px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.bdg.b1{background:var(--primary-soft);color:var(--primary-ink);border-color:#c9dcff}
.bdg.b2{background:var(--success-soft);color:var(--success);border-color:#c3ead9}
.bdg.b3{background:var(--teal-soft);color:var(--teal);border-color:#c2e4ef}
.bdg.gray{background:#eef1f6;color:var(--text-3);border-color:#e0e6ef}
.bdg.real{background:var(--success-soft);color:var(--success);border-color:#c3ead9}
.bdg.demo{background:var(--warn-soft);color:var(--warn);border-color:#f0dcc0}
.bdg.warn{background:var(--warn-soft);color:var(--warn);border-color:#f0dcc0}
.bdg.danger{background:var(--danger-soft);color:var(--danger);border-color:#f7cfcd}

/* ---------------- 图卡 ---------------- */
.fig{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin:16px 0 22px;scroll-margin-top:74px}
.fig-head{display:flex;align-items:center;gap:9px;padding:12px 16px;background:linear-gradient(180deg,#fbfcfe,#f4f8fd);border-bottom:1px solid var(--border);flex-wrap:wrap}
.fig-head h3{font-size:14.8px}
.fig-sub{padding:9px 16px;font-size:13.2px;color:var(--text-3);border-bottom:1px dashed var(--border);background:#fff}
.fig-sub b{color:var(--text-2)}
.fig-body{display:grid;grid-template-columns:minmax(0,1fr) 276px}
@media(max-width:1100px){.fig-body{grid-template-columns:1fr}}
.fig-canvas{position:relative;padding:16px 18px;background:#fff;min-height:120px}
.fig-side{border-left:1px dashed var(--border-strong);padding:12px;background:var(--bg2)}
@media(max-width:1100px){.fig-side{border-left:0;border-top:1px dashed var(--border-strong)}}
.fig-foot{padding:10px 16px;border-top:1px solid var(--border);background:var(--bg2);font-size:12.8px;color:var(--text-3);line-height:1.8}
.fig-foot b{color:var(--text-2)}
.side-t{font-size:11.5px;font-weight:800;color:var(--text-3);letter-spacing:1.1px;margin:2px 0 8px 6px}

.co{display:flex;gap:8px;padding:7px 8px;border-radius:9px;transition:.18s;align-items:flex-start}
.co:hover{background:#fff;box-shadow:0 0 0 1px var(--border),0 4px 12px -8px rgba(16,32,64,.3)}
.co>b{font-size:13.1px;font-weight:800;display:block;color:var(--text);line-height:1.55}
.co>div>span{font-size:12.5px;color:var(--text-3);line-height:1.7;display:block}
.co-n{width:19px;height:19px;flex:none;border-radius:50%;background:var(--primary);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.co.on{background:#fff;box-shadow:0 0 0 1px #c3d4ff,0 4px 14px -8px rgba(29,78,216,.5)}
.co.on .co-n{background:var(--primary-ink);transform:scale(1.12)}

.chartwrap{position:relative}
.pinlayer{position:absolute;inset:0;pointer-events:none;z-index:6}
.pin{
  position:absolute;transform:translate(-50%,-50%);width:21px;height:21px;border-radius:50%;pointer-events:auto;
  background:var(--primary);color:#fff;font-size:11.5px;font-weight:800;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;z-index:6;cursor:pointer;
  box-shadow:0 2px 8px rgba(29,78,216,.45);transition:transform .2s,box-shadow .2s;
}
.pin:hover,.pin.on{transform:translate(-50%,-50%) scale(1.42);box-shadow:0 0 0 7px rgba(29,78,216,.16),0 2px 8px rgba(29,78,216,.5)}
body.nopin .pin{display:none}

/* ---------------- 小型图表专用 ---------------- */
.lc-wrap{position:relative}
.lc-tip{position:absolute;pointer-events:none;background:rgba(22,32,46,.95);color:#fff;border-radius:9px;padding:8px 11px;font-size:12.2px;line-height:1.65;box-shadow:0 6px 22px rgba(0,0,0,.28);z-index:9;min-width:130px}
.lc-ttitle{font-weight:800;margin-bottom:4px;font-size:12.4px;color:#e8eeff}
.lc-trow{display:flex;justify-content:space-between;gap:16px}
.lc-tname{display:inline-flex;align-items:center;gap:5px;color:#b9c6da}
.lc-trow i{width:9px;height:9px;border-radius:2px;display:inline-block}
.lc-trow i.lc-dash{border-top:2px dashed;background:none;height:0;width:11px;border-radius:0}
.lc-tval{font-weight:700}
.lc-hl line{stroke-dasharray:4 4}

.heat{display:flex;flex-direction:column;gap:5px}
.heat-row{display:flex;gap:5px;align-items:center}
.heat-lb{width:96px;flex:none;text-align:right;font-size:11.6px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat-cell{flex:1;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;transition:.2s;cursor:default}
.heat-cell:hover{outline:2px solid var(--primary);outline-offset:1px}
.heat-hd{display:flex;gap:5px;align-items:center;margin-bottom:3px}
.heat-hd .heat-lb{font-weight:700;color:var(--text-3);font-size:11.2px}
.heat-hd .heat-cell{height:auto;background:none!important;color:var(--text-3);font-size:11.2px;font-weight:700}
.rank-b{display:flex;flex-direction:column;gap:9px}
.rank-r{display:flex;align-items:center;gap:9px}
.rank-lb{width:92px;flex:none;text-align:right;font-size:12.2px;color:var(--text-2)}
.rank-bar{flex:1;height:19px;border-radius:5px;overflow:hidden;display:flex;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border)}
.rank-bar i{height:100%;transition:width .9s cubic-bezier(.2,.75,.3,1)}
.rank-v{width:74px;flex:none;font-size:12.2px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-2)}
.rank-r.spot .rank-lb{color:var(--primary);font-weight:800}

.dotm{display:flex;flex-direction:column;gap:7px}
.dotm-r{display:flex;gap:10px;align-items:center}
.dotm-lb{width:88px;flex:none;text-align:right;font-size:11.4px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dotm-g{display:flex;flex-wrap:wrap;gap:3px;flex:1}
.dotm i{width:9px;height:9px;border-radius:2px;display:block}
.dotm i.r{box-shadow:0 0 0 1.5px rgba(204,47,42,.9)}
.dotm i.h{outline:1.4px dashed var(--danger);outline-offset:1.2px}

.kpirow{display:flex;gap:9px;flex-wrap:wrap}
.kpi{flex:1;min-width:118px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:10px 12px;box-shadow:0 1px 2px rgba(16,32,64,.04)}
.kpi b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi span{font-size:11.8px;color:var(--text-3)}
.kpi.hot{border-color:#f7cfcd;background:#fff8f8}
.kpi.hot b{color:var(--danger)}

.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.2px;color:var(--text-3);margin-top:11px}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.leg i.ring{border-radius:50%;border:2px solid var(--text-3);background:none}

.mini-cap{font-size:12.2px;color:var(--text-3);margin-top:9px;line-height:1.75}
.mini-cap b{color:var(--text-2)}

/* 联动关系图 */
.flow-svg{width:100%;height:auto;display:block}
.flow-svg text{font-family:inherit}
.fm-node{transition:.2s;cursor:default}
.fm-node:hover rect{filter:drop-shadow(0 3px 8px rgba(29,78,216,.35))}

/* ---------------- 动效 ---------------- */
@keyframes docPulse { 0%,100%{opacity:1;r:6} 50%{opacity:.35} }
.op-pulse-ring{animation:docPulse 2.1s ease-in-out infinite;transform-box:fill-box}
@keyframes docFade { from{opacity:0;transform:translateY(6px)} }
.sec{animation:docFade .45s cubic-bezier(.2,.7,.3,1) both}

/* 方案 A：环形仪表盘阵列 */
.vz-rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.vz-ring{position:relative;text-align:center;padding:6px 2px;border-radius:11px;transition:.22s}
.vz-ring:hover{background:var(--surface-2);transform:translateY(-2px)}
.vz-ring-svg{width:76px;height:76px;display:block;margin:0 auto}
.vz-rc{position:absolute;left:0;right:0;top:30px;pointer-events:none;line-height:1.1}
.vz-rc b{display:block;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.vz-rc span{font-size:9.5px;color:var(--text-3)}
.vz-rn{font-size:11.6px;font-weight:700;margin-top:2px}
.vz-rm{font-size:10.4px;color:var(--text-3)}
.vz-rm em{font-style:normal;font-weight:700;color:var(--danger)}
.vz-ring.is-bad .vz-ring-svg{animation:docRingGlow 2.1s ease-in-out infinite}
@keyframes docRingGlow{50%{filter:drop-shadow(0 0 7px rgba(204,47,42,.5))}}

/* 方案 B：流向桑基 */
.vz-flow{width:100%;height:auto;display:block}
.vz-fl-node{cursor:default}
.vz-fl-node rect{transition:filter .2s}
.vz-fl-node:hover rect{filter:drop-shadow(0 0 5px rgba(29,78,216,.5))}
.vz-fl-dash{animation:docFlow 1.15s linear infinite}
@keyframes docFlow{to{stroke-dashoffset:-24}}

/* 方案 C：气泡 */
.vz-bub{animation:docPop .5s cubic-bezier(.2,.75,.3,1) both}
@keyframes docPop{from{transform:scale(.2);opacity:0;transform-box:fill-box;transform-origin:center}}
.vz-bub.al{animation:docPop .5s cubic-bezier(.2,.75,.3,1) both,docBubPulse 1.9s ease-in-out infinite .5s}
@keyframes docBubPulse{50%{fill-opacity:.95}}

@media print{
  .topbar,.toc{display:none}
  .layout{display:block;max-width:none;padding:0}
  .fig{break-inside:avoid;box-shadow:none}
  body{background:#fff}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">图表逻辑关系说明 <small>NXP OneBE 交接演示 · ops-handover-demo</small></div>
    <div class="tb-spacer"></div>
    <span class="bdg bdg gray" id="statBadge">加载中…</span>

    <button class="tbtn" onclick="window.print()">打印 / 存 PDF</button>
  </div>
</header>

<div class="layout">
  <nav class="toc" id="toc"></nav>
  <main id="main"></main>
</div>

const nf = (v, d) => {
  if (v == null || !isFinite(v)) return '—';
  const n = Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * Math.pow(10, d == null ? 1 : d)) / Math.pow(10, d == null ? 1 : d);

/* 2.1 lineChart —— 全站最主要的基元 */
function docLine(host, o) {
  const W = o.vw || 1000, H = o.height || 240, k = 1000 / W;
  const pl = Math.round(46 * k), pr = Math.round(18 * k), pt = Math.round(16 * k), pb = Math.round(30 * k);
  const iw = W - pl - pr, ih = H - pt - pb;
  const F = n => (n * k).toFixed(1);
  const { series, labels, marks = [], endAt = -1, min = 0, max = 100, yUnit = '', endUnit = '',
    hover = true, tipUnit = '', tipTitle = null, tipExtra = null } = o;
  const step = iw / (labels.length - 1);
  const X = i => pl + i * step, Y = v => pt + ih - (v - min) / (max - min) * ih;

  let grid = '', ticks = '';
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * i / 4, y = Y(v);
    grid += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '" stroke="#e6ebf3" stroke-width="1"/>';
    ticks += '<text x="' + (pl - 10 * k).toFixed(1) + '" y="' + (y + 4 * k).toFixed(1) + '" text-anchor="end" font-size="' + F(12) + '" fill="#8a95a5">' + Math.round(v) + yUnit + '</text>';
  }
  let xt = '';
  labels.forEach((l, i) => {
    if (i === endAt) return;
    if (i % 3 === 0 || i === labels.length - 1) {
      xt += '<text x="' + X(i) + '" y="' + (H - 8 * k).toFixed(1) + '" text-anchor="middle" font-size="' + F(12) + '" fill="#8a95a5">' + esc(l) + '</text>';
    }
  });
  /* null = 该日无数据：跳过该点，不编造 */
  const seg = s => {
    let d = '', first = -1, last = -1;
    s.data.forEach((v, i) => {
      if (v == null || !isFinite(v)) return;
      if (first < 0) first = i;
      last = i;
      d += (first === i ? 'M' : 'L') + X(i).toFixed(1) + ',' + Y(v).toFixed(1) + ' ';
    });
    return { d: d.trim(), first, last };
  };
  const paths = series.map(s => {
    const g = seg(s);
    if (!g.d) return '';
    const area = (s.fill && g.last > g.first)
      ? '<path d="' + g.d + ' L' + X(g.last).toFixed(1) + ',' + (pt + ih) + ' L' + X(g.first).toFixed(1) + ',' + (pt + ih) + ' Z" fill="' + s.color + '" opacity=".10"/>' : '';
    const dash = s.dash ? ' stroke-dasharray="' + String(s.dash === true ? '7 5' : s.dash).split(' ').map(n => (Number(n) * k).toFixed(1)).join(' ') + '"' : '';
    return area + '<path d="' + g.d + '" fill="none" stroke="' + s.color + '" stroke-width="' + F(s.width || 2.4) + '"' + dash + ' stroke-linejoin="round" stroke-linecap="round"/>';
  }).join('');
  const dots = series.map(s => s.data.map((v, i) =>
    (v == null || !isFinite(v)) ? ''
      : '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="' + F(s.dash ? 2.6 : 3.4) + '" fill="' + (s.dash ? '#fff' : s.color) + '" stroke="' + s.color + '" stroke-width="' + F(2) + '"/>'
  ).join('')).join('');
  let mk = '';
  (marks || []).forEach(m => {
    if (m.v == null || !isFinite(m.v)) return;
    const x = X(m.i), y = Y(m.v), c = m.color || '#cc2f2a';
    mk += '<rect x="' + (x - step / 2).toFixed(1) + '" y="' + pt + '" width="' + step.toFixed(1) + '" height="' + ih + '" fill="' + c + '" opacity=".10"/>';
    mk += '<circle class="op-pulse-ring" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + F(6) + '" fill="none" stroke="' + c + '" stroke-width="' + F(2.2) + '"/>';
    if (m.text) mk += '<text x="' + x.toFixed(1) + '" y="' + (y - 13 * k).toFixed(1) + '" text-anchor="middle" font-size="' + F(12.5) + '" font-weight="800" fill="' + c + '">' + esc(m.text) + '</text>';
  });
  let ends = '';
  if (endAt >= 0 && endAt < labels.length) {
    ends += '<line x1="' + X(endAt).toFixed(1) + '" y1="' + pt + '" x2="' + X(endAt).toFixed(1) + '" y2="' + (pt + ih) + '" stroke="#c9d2e0" stroke-width="1" stroke-dasharray="' + F(4) + ' ' + F(4) + '"/>';
    ends += '<text x="' + X(endAt).toFixed(1) + '" y="' + (H - 8 * k).toFixed(1) + '" text-anchor="middle" font-size="' + F(12) + '" font-weight="700" fill="#5b6577">' + esc(labels[endAt]) + '</text>';
    series.forEach((s, si) => {
      const v = s.data[endAt];
      if (v == null || !isFinite(v)) return;
      const dy = si === 0 ? -11 * k : 17 * k;
      ends += '<text x="' + (X(endAt) + 15 * k).toFixed(1) + '" y="' + (Y(v) + dy).toFixed(1) + '" font-size="' + F(12.5) + '" font-weight="800" fill="' + s.color + '">' + nf(v) + endUnit + '</text>';
    });
  }
  const hlGroup = hover ? '<g class="lc-hl" style="display:none"></g>' : '';
  host.innerHTML = '<div class="lc-wrap">'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" style="display:block;width:100%;height:auto;overflow:visible">'
    + grid + xt + ticks + paths + mk + ends + dots + hlGroup + '</svg>'
    + (hover ? '<div class="lc-tip" style="display:none"></div>' : '') + '</div>';

  if (!hover) return;
  const svg = host.querySelector('svg'), hl = host.querySelector('.lc-hl'), tipEl = host.querySelector('.lc-tip');
  const fmtTip = v => (v == null || !isFinite(v)) ? '—' : nf(v) + tipUnit;
  const show = (clientX, clientY) => {
    const r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const vx = (clientX - r.left) / r.width * W;
    let i = Math.round((vx - pl) / step);
    i = Math.max(0, Math.min(labels.length - 1, i));
    let h = '<line x1="' + X(i).toFixed(1) + '" y1="' + pt + '" x2="' + X(i).toFixed(1) + '" y2="' + (pt + ih) + '" stroke="#8d9bb0" stroke-width="' + F(1.2) + '" stroke-dasharray="' + F(4) + ' ' + F(4) + '"/>';
    series.forEach(s => {
      const v = s.data[i];
      if (v == null || !isFinite(v)) return;
      h += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="' + F(6) + '" fill="#fff" stroke="' + s.color + '" stroke-width="' + F(2.6) + '"/>';
    });
    hl.innerHTML = h; hl.style.display = '';
    const rows = series.map(s => {
      const sw = s.dash ? '<i class="lc-dash" style="border-color:' + s.color + '"></i>' : '<i style="background:' + s.color + '"></i>';
      return '<div class="lc-trow"><span class="lc-tname">' + sw + esc(s.name) + '</span><span class="lc-tval" style="color:' + s.color + '">' + fmtTip(s.data[i]) + '</span></div>';
    }).join('');
    tipEl.innerHTML = '<div class="lc-ttitle">' + (tipTitle ? tipTitle(i) : esc(labels[i])) + '</div>' + rows + (tipExtra ? tipExtra(i) : '');
    tipEl.style.display = 'block';
    const ratio = r.width / W, tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
    let left = X(i) * ratio + 18;
    if (left + tw > r.width - 4) left = X(i) * ratio - tw - 18;
    if (left < 4) left = 4;
    const vy = (clientY - r.top) / r.height * H * ratio;
    let top = vy - th / 2;
    if (top < 4) top = 4;
    if (top + th > r.height - 4) top = r.height - th - 4;
    tipEl.style.left = left.toFixed(1) + 'px';
    tipEl.style.top = top.toFixed(1) + 'px';
  };
  const hide = () => { tipEl.style.display = 'none'; hl.style.display = 'none'; };
  svg.addEventListener('mousemove', e => show(e.clientX, e.clientY));
  svg.addEventListener('mouseleave', hide);
}

/* 2.2 donut —— 单圆 stroke-dasharray 分段，rotate(-90) 从 12 点方向开始 */
function docDonut(host, items, size, centerTop, centerSub) {
  const total = items.reduce((a, b) => a + b.value, 0) || 1;
  const r = 68, cx = 95, cy = 95, C = 2 * Math.PI * r;
  let acc = 0, segs = '';
  items.forEach(it => {
    const len = it.value / total * C;
    segs += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + it.color + '" stroke-width="24" '
      + 'stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-acc) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
    acc += len;
  });
  host.innerHTML = '<svg viewBox="0 0 190 190" width="' + (size || 190) + '" height="' + (size || 190) + '" style="max-width:100%">' + segs
    + '<text x="95" y="92" text-anchor="middle" font-size="30" font-weight="700" fill="#16202e">' + esc(centerTop) + '</text>'
    + '<text x="95" y="112" text-anchor="middle" font-size="13" fill="#8a95a5">' + esc(centerSub) + '</text></svg>';
}

/* 2.3 hBars —— 横向排行条（纯 DOM div，宽度 = value / max） */
function docHBars(host, items, suffix) {
  const max = Math.max.apply(null, items.map(i => i.value)) || 1;
  host.innerHTML = items.map(i =>
    '<div style="margin-bottom:13px">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">'
    + '<span style="font-size:13.6px">' + esc(i.label) + '</span>'
    + '<span style="font-size:14px;font-weight:700;font-variant-numeric:tabular-nums">' + i.value + (suffix || '') + '</span></div>'
    + '<div style="height:8px;border-radius:5px;background:#eef2f8;overflow:hidden">'
    + '<i style="display:block;height:100%;width:' + (i.value / max * 100).toFixed(1) + '%;background:' + i.color + ';border-radius:5px;transition:width .9s cubic-bezier(.2,.75,.3,1)"></i>'
    + '</div></div>').join('');
}

/* 2.4 barGroup —— 全站未调用的保留基元 */
function docBarGroup(host, o) {
  const labels = o.labels, series = o.series, H = o.height || 220;
  const W = 1000, pl = 46, pr = 16, pt = 14, pb = 32;
  const iw = W - pl - pr, ih = H - pt - pb;
  const maxV = o.max || Math.max.apply(null, series.reduce((a, s) => a.concat(s.data), [])) * 1.15;
  const gw = iw / labels.length, bw = Math.min(26, (gw - 18) / series.length);
  let grid = '', ticks = '';
  for (let i = 0; i <= 4; i++) {
    const v = maxV * i / 4, y = pt + ih - v / maxV * ih;
    grid += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '" stroke="#e6ebf3"/>';
    ticks += '<text x="' + (pl - 10) + '" y="' + (y + 4) + '" text-anchor="end" font-size="12" fill="#8a95a5">' + Math.round(v) + '</text>';
  }
  let bars = '', xt = '';
  labels.forEach((l, i) => {
    const cx = pl + gw * i + gw / 2;
    series.forEach((s, j) => {
      const v = s.data[i], h = ih * (v / maxV);
      const x = cx - (series.length * bw + (series.length - 1) * 6) / 2 + j * (bw + 6);
      bars += '<rect x="' + x + '" y="' + (pt + ih - h) + '" width="' + bw + '" height="' + Math.max(h, 1) + '" rx="4" fill="' + s.color + '"/>';
    });
    xt += '<text x="' + cx + '" y="' + (H - 9) + '" text-anchor="middle" font-size="12.5" fill="#8a95a5">' + esc(l) + '</text>';
  });
  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" style="overflow:visible">' + grid + ticks + bars + xt + '</svg>';
}


/* ==========================================================================
   3. WIP 看板的自绘可视化（热力矩阵 / 排行堆叠条 / 五个动效方案）
   ========================================================================== */
const WIP = DATA.wip;
const TYPE_COLOR = {};
WIP.typeMap.forEach(t => { TYPE_COLOR[t.id] = t.color; });
const typeColor = t => TYPE_COLOR[t] || '#1d4ed8';
const stepsDesc = WIP.stepMap.slice().sort((a, b) => b.qty - a.qty);   /* ctx.steps：按在制量降序 */
const stepsOrder = WIP.stepMap;                                        /* ctx.stepsOrder：报表工艺顺序 */
const stepMaxQty = stepsDesc.length ? stepsDesc[0].qty : 1;

/* 3.1 工序 × PKG Type 热力矩阵（列归一化：分母取「全部工序」中该品类的最大值） */
function heatGrid(host, rows, rowCount) {
  const types = WIP.typeOrder;
  const colMax = types.map((t, ti) => Math.max.apply(null, WIP.stepMap.map(s => s.byType[ti])) || 1);
  const use = rows.slice(0, rowCount || 16);
  let h = '<div class="heat"><div class="heat-row heat-hd"><div class="heat-lb">工序 \\ 品类</div>'
    + types.map(t => '<div class="heat-cell">' + esc(t) + '</div>').join('') + '</div>';
  use.forEach(s => {
    h += '<div class="heat-row" data-step="' + esc(s.name) + '"><div class="heat-lb" title="' + esc(s.name) + '">' + esc(s.name) + '</div>';
    types.forEach((t, ti) => {
      const v = s.byType[ti], ratio = v / colMax[ti];
      if (!v) { h += '<div class="heat-cell" style="background:#f2f5fa;color:#b6c0cf">·</div>'; return; }
      h += '<div class="heat-cell" style="background:' + typeColor(t) + ';opacity:' + (0.07 + ratio * 0.78).toFixed(3)
        + '" title="' + esc(s.name) + ' × ' + esc(t) + '：' + nf(v / 1000) + 'K（列内占比 ' + Math.round(ratio * 100) + '%）">'
        + (v / 1000 >= 10 ? Math.round(v / 1000) : '') + '</div>';
    });
    h += '</div>';
  });
  host.innerHTML = h + '</div>';
}

/* 3.2 工序 WIP 排行（堆叠条：前 12 名 + 「其余 N 个工序合计」） */
function rankBars(host) {
  const top = stepsDesc.slice(0, 12);
  const rest = stepsDesc.slice(12);
  const max = top.length ? top[0].qty : 1;
  const restByType = WIP.typeOrder.map((t, ti) => rest.reduce((a, s) => a + s.byType[ti], 0));
  const rows = top.map(s => ({ name: s.name, byType: s.byType, total: s.qty, small: false }));
  if (rest.length) rows.push({ name: '其余 ' + rest.length + ' 个工序', byType: restByType, total: restByType.reduce((a, b) => a + b, 0), small: true });
  host.innerHTML = '<div class="rank-b">' + rows.map(r => {
    const segs = WIP.typeOrder.map((t, ti) => r.byType[ti]
      ? '<i style="width:' + (r.byType[ti] / max * 100).toFixed(2) + '%;background:' + typeColor(t) + '" title="' + esc(t) + ' ' + nf(r.byType[ti] / 1000) + 'K"></i>' : '').join('');
    return '<div class="rank-r" data-step="' + esc(r.name) + '">'
      + '<div class="rank-lb" title="' + esc(r.name) + '" style="' + (r.small ? 'color:#8a95a5' : '') + '">' + esc(r.name) + '</div>'
      + '<div class="rank-bar">' + segs + '</div>'
      + '<div class="rank-v">' + nf(r.total / 1000) + 'K</div></div>';
  }).join('') + '</div>';
}

/* 3.3 方案 A：环形仪表盘阵列 —— 弧长 = 0.1 + 0.9 × (该工序量 / 最大工序量) */
function vzA(host) {
  host.innerHTML = '<div class="vz-rings">' + stepsDesc.map((s, i) => {
    const p = 0.1 + 0.9 * (s.qty / stepMaxQty);
    const bad = s.hold > 0 || s.otd > 0;
    const dom = WIP.typeOrder[s.byType.indexOf(Math.max.apply(null, s.byType))];
    const R = 30, C = 2 * Math.PI * R;
    return '<div class="vz-ring' + (bad ? ' is-bad' : '') + '" data-step="' + esc(s.name) + '">'
      + '<svg viewBox="0 0 76 76" class="vz-ring-svg">'
      + '<circle cx="38" cy="38" r="' + R + '" fill="none" stroke="#eef2f8" stroke-width="7"/>'
      + '<circle cx="38" cy="38" r="' + R + '" fill="none" stroke="' + typeColor(dom) + '" stroke-width="7" stroke-linecap="round" '
      + 'stroke-dasharray="' + (C * p).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 38 38)"/>'
      + '</svg><div class="vz-rc"><b>' + nf(s.qty / 1000) + '</b><span>K</span></div>'
      + '<div class="vz-rn">' + esc(s.name) + '</div>'
      + '<div class="vz-rm">' + s.lots + ' 批' + (bad ? ' · <em>' + (s.hold ? 'Hold ' + s.hold : '') + (s.hold && s.otd ? ' / ' : '') + (s.otd ? 'OTD ' + s.otd : '') + '</em>' : '') + '</div>'
      + '</div>';
  }).join('') + '</div>';
}

/* 3.4 方案 B：工序 → 品类 流向桑基 */
function vzB(host) {
  const W = 760, H = 620, padT = 26, padB = 16;
  const left = stepsOrder, types = WIP.typeOrder;
  const total = left.reduce((a, s) => a + s.qty, 0) || 1;
  const usable = H - padT - padB;
  const gap = 5, minH = 6;
  /* 左列节点高：按占比，带最小高度，避免 24 个工序里小工序被压没 */
  let raw = left.map(s => s.qty / total);
  let hs = raw.map(r => Math.max(minH, r * (usable - gap * (left.length - 1))));
  let sum = hs.reduce((a, b) => a + b, 0);
  const kk = (usable - gap * (left.length - 1)) / sum;
  hs = hs.map(h => h * kk);
  const tTot = types.map((t, ti) => left.reduce((a, s) => a + s.byType[ti], 0));
  const tSum = tTot.reduce((a, b) => a + b, 0) || 1;
  let ths = tTot.map(v => Math.max(minH, v / tSum * (usable - gap * (types.length - 1))));
  const tk = (usable - gap * (types.length - 1)) / ths.reduce((a, b) => a + b, 0);
  ths = ths.map(h => h * tk);

  const lx = 92, lw = 12, rx = W - 96, rw = 12;
  const ys = []; let y = padT;
  hs.forEach(h => { ys.push(y); y += h + gap; });
  const tys = []; let ty = padT;
  ths.forEach(h => { tys.push(ty); ty += h + gap; });

  let svg = '';
  /* 飘带：每条工序 × 品类的连线 */
  const lCur = ys.slice(), rCur = tys.slice();
  types.forEach((tp, ti) => {
    left.forEach((s, si) => {
      const v = s.byType[ti];
      if (!v) return;
      const lh = v / s.qty * hs[si], rh = v / tTot[ti] * ths[ti];
      const y1 = lCur[si] + lh / 2, y2b = rCur[ti] + rh / 2;
      lCur[si] += lh; rCur[ti] += rh;
      const wide = rh >= 5;
      svg += '<path d="M' + (lx + lw) + ',' + y1.toFixed(1) + ' C' + (lx + 170) + ',' + y1.toFixed(1) + ' ' + (rx - 170) + ',' + y2b.toFixed(1) + ' ' + rx + ',' + y2b.toFixed(1) + '" '
        + 'fill="none" stroke="' + typeColor(tp) + '" stroke-width="' + Math.max(1.2, rh).toFixed(1) + '" stroke-opacity=".30"/>';
      /* 宽飘带叠加一条细虚线指示流向（与真实页面一致：虚线是叠加层，不是飘带本体） */
      if (wide) svg += '<path d="M' + (lx + lw) + ',' + y1.toFixed(1) + ' C' + (lx + 170) + ',' + y1.toFixed(1) + ' ' + (rx - 170) + ',' + y2b.toFixed(1) + ' ' + rx + ',' + y2b.toFixed(1) + '" '
        + 'fill="none" stroke="' + typeColor(tp) + '" stroke-width="2" stroke-opacity=".55" stroke-dasharray="5 7" class="vz-fl-dash"/>';
    });
  });
  /* 节点 */
  left.forEach((s, si) => {
    const bad = s.hold > 0 || s.otd > 0;
    svg += '<g class="vz-fl-node" data-step="' + esc(s.name) + '">'
      + '<rect x="' + lx + '" y="' + ys[si].toFixed(1) + '" width="' + lw + '" height="' + hs[si].toFixed(1) + '" rx="3" fill="#c8d4e6"'
      + (bad ? ' stroke="#cc2f2a" stroke-width="1.4"' : '') + '/>'
      + '<text x="' + (lx - 7) + '" y="' + (ys[si] + hs[si] / 2 + 3.6).toFixed(1) + '" text-anchor="end" font-size="10.4" fill="#4a5567">' + esc(s.name) + '</text>'
      + '</g>';
  });
  types.forEach((t, ti) => {
    svg += '<g class="vz-fl-node">'
      + '<rect x="' + rx + '" y="' + tys[ti].toFixed(1) + '" width="' + rw + '" height="' + ths[ti].toFixed(1) + '" rx="3" fill="' + typeColor(t) + '"/>'
      + '<text x="' + (rx + rw + 7) + '" y="' + (tys[ti] + ths[ti] / 2 - 1).toFixed(1) + '" font-size="11.2" font-weight="700" fill="#4a5567">' + esc(t) + '</text>'
      + '<text x="' + (rx + rw + 7) + '" y="' + (tys[ti] + ths[ti] / 2 + 11).toFixed(1) + '" font-size="10" fill="#8a95a5">' + nf(tTot[ti] / 1000) + 'K</text>'
      + '</g>';
  });
  host.innerHTML = '<svg class="vz-flow" viewBox="0 0 ' + W + ' ' + H + '" style="max-height:620px">' + svg + '</svg>';
}

/* 3.5 方案 C：CT × 数量 气泡象限（一批 = 一气泡） */
function vzC(host) {
  const W = 760, H = 420, pl = 54, pr = 20, pt = 22, pb = 46;
  const iw = W - pl - pr, ih = H - pt - pb;
  const lots = WIP.lots.filter(l => l[2] != null);
  const cts = lots.map(l => l[2]), qs = lots.map(l => l[3]);
  const ctMax = Math.max.apply(null, cts) * 1.04;
  const qMin = Math.max(1, Math.min.apply(null, qs)), qMax = Math.max.apply(null, qs);
  const X = ct => pl + ct / ctMax * iw;
  const Y = q => pt + ih - (Math.log(q) - Math.log(qMin)) / (Math.log(qMax) - Math.log(qMin)) * ih;
  const R = q => 2.1 + Math.sqrt(q / qMax) * 6.2;
  const AL = WIP.alarm;
  let g = '';
  /* 报警带：CT 黄线、红线 */
  g += '<rect x="' + pl + '" y="' + pt + '" width="' + (X(AL.ctY) - pl).toFixed(1) + '" height="' + ih + '" fill="#12805a" opacity=".055"/>';
  g += '<rect x="' + X(AL.ctY).toFixed(1) + '" y="' + pt + '" width="' + (X(AL.ctR) - X(AL.ctY)).toFixed(1) + '" height="' + ih + '" fill="#a8620b" opacity=".075"/>';
  g += '<rect x="' + X(AL.ctR).toFixed(1) + '" y="' + pt + '" width="' + (W - pr - X(AL.ctR)).toFixed(1) + '" height="' + ih + '" fill="#cc2f2a" opacity=".085"/>';
  [0, .25, .5, .75, 1].forEach(f => {
    const v = qMin * Math.pow(qMax / qMin, f), y = Y(v);
    g += '<line x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (W - pr) + '" y2="' + y.toFixed(1) + '" stroke="#e6ebf3"/>';
    g += '<text x="' + (pl - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="#8a95a5">' + (v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v)) + '</text>';
  });
  for (let d = 0; d <= ctMax; d += Math.max(1, Math.round(ctMax / 6))) {
    g += '<text x="' + X(d).toFixed(1) + '" y="' + (H - pb + 16) + '" text-anchor="middle" font-size="10.5" fill="#8a95a5">' + d + '</text>';
  }
  g += '<text x="' + (pl + iw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="#8a95a5">BE CT（天）→ 越靠右在制越久</text>';
  g += '<text x="14" y="' + (pt - 8) + '" font-size="11" fill="#8a95a5">在制数量（颗 · 对数轴）</text>';
  /* 按数量降序绘制 → 大泡在底层，小泡不被遮住 */
  lots.slice().sort((a, b) => b[3] - a[3]).forEach(l => {
    const bad = l[2] >= AL.ctR || (l[5] != null && l[5] < AL.otd);
    g += '<circle class="vz-bub' + (bad ? ' al' : '') + '" cx="' + X(l[2]).toFixed(1) + '" cy="' + Y(l[3]).toFixed(1) + '" r="' + R(l[3]).toFixed(2) + '" '
      + 'fill="' + typeColor(WIP.typeOrder[l[1]]) + '" fill-opacity=".62" stroke="' + (bad ? '#cc2f2a' : '#fff') + '" stroke-width="' + (bad ? 1.3 : .7) + '">'
      + '<title>' + esc(WIP.typeOrder[l[1]]) + ' · CT ' + l[2] + ' 天 · ' + l[3] + ' 颗' + (l[4] ? ' · Hold ' + l[4] + '天' : '') + (l[5] != null && l[5] < 0 ? ' · OTD 逾期' : '') + '</title></circle>';
  });
  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' + g + '</svg>';
}

/* 3.6 方案 D：批次点阵（一批 = 一方块，按工序分行） */
function vzD(host) {
  host.innerHTML = '<div class="dotm">' + stepsDesc.map(s => {
    const si = WIP.stepOrder.indexOf(s.name);
    const list = WIP.lots.filter(l => l[0] === si);
    return '<div class="dotm-r"><div class="dotm-lb" title="' + esc(s.name) + '">' + esc(s.name) + '</div><div class="dotm-g">'
      + list.map(l => {
        const bad = (l[2] != null && l[2] >= WIP.alarm.ctR) || (l[5] != null && l[5] < WIP.alarm.otd);

/* 3.7 方案 E：极坐标弧（中心品类甜甜圈 + 外圈工序径向柱） */
function vzE(host) {
  const W = 760, H = 640, cx = 380, cy = 300;
  const R0 = 138, maxLen = 100, donutR = 88, donutW = 24;
  const types = WIP.typeOrder;
  const tTot = types.map((t, ti) => WIP.stepMap.reduce((a, s) => a + s.byType[ti], 0));
  const gt = tTot.reduce((a, b) => a + b, 0) || 1;
  const C = 2 * Math.PI * donutR;
  let acc = 0, donut = '';
  types.forEach((t, ti) => {
    const len = tTot[ti] / gt * C;
    donut += '<circle cx="' + cx + '" cy="' + cy + '" r="' + donutR + '" fill="none" stroke="' + typeColor(t) + '" stroke-width="' + donutW + '" '
      + 'stroke-dasharray="' + len.toFixed(1) + ' ' + (C - len).toFixed(1) + '" stroke-dashoffset="' + (-acc).toFixed(1) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
    acc += len;
  });
  /* 外圈：按报表工艺顺序排布，长度 = 16 + 该工序量 / 最大量 × 112 */
  const n = stepsOrder.length;
  let bars = '';
  stepsOrder.forEach((s, i) => {
    const a = i / n * 360 - 90;
    const len = 14 + (s.qty / stepMaxQty) * 96;
    const bad = s.hold > 0 || s.otd > 0;
    const dom = WIP.typeOrder[s.byType.indexOf(Math.max.apply(null, s.byType))];
    const rad = (a - 90) * Math.PI / 180;
    const lx = cx + Math.cos(rad) * (R0 + maxLen + 18), ly = cy + Math.sin(rad) * (R0 + maxLen + 18);
    const anchor = Math.cos(rad) > 0.25 ? 'start' : (Math.cos(rad) < -0.25 ? 'end' : 'middle');
    bars += '<g class="vz-pbar-g"><g transform="rotate(' + a.toFixed(2) + ' ' + cx + ' ' + cy + ')">'
      + '<rect class="vz-pbar' + (bad ? ' is-bad' : '') + '" x="' + (cx - 6) + '" y="' + (cy - R0 - len).toFixed(1) + '" width="12" height="' + len.toFixed(1) + '" rx="6" fill="' + typeColor(dom) + '"/>'
      + '</g>'
      + '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '" font-size="10" fill="#8a95a5">' + esc(s.name) + '</text></g>';
  });
  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">'
    + '<circle cx="' + cx + '" cy="' + cy + '" r="' + R0 + '" fill="none" stroke="#eef2f8" stroke-width="1" stroke-dasharray="3 5"/>'
    + donut + bars
    + '<text x="' + cx + '" y="' + (cy + 2) + '" text-anchor="middle" font-size="28" font-weight="800" fill="#16202e">' + nf(WIP.totalQtyK) + 'K</text>'
    + '<text x="' + cx + '" y="' + (cy + 22) + '" text-anchor="middle" font-size="11.5" fill="#8a95a5">在制总量</text>'
    + '<text x="' + cx + '" y="' + (cy + 42) + '" text-anchor="middle" font-size="11" fill="#8a95a5">' + n + ' 工序 / ' + types.length + ' 品类 / ' + WIP.totalLots + ' 批</text>'
    + '</svg>';
}

const MOUNT = [];
function fig(id, o) {

    : (o.side || '');
  return '<section class="fig" id="' + id + '">'
    + '<div class="fig-head"><h3>' + o.title + '</h3>' + (o.tags || '') + '</div>'
    + (o.sub ? '<div class="fig-sub">' + o.sub + '</div>' : '')
    + '<div class="fig-body"><div class="fig-canvas"><div class="chartwrap"><div class="pinlayer">' + pins + '</div><div id="' + id + 'c"></div></div></div>'
    + '<aside class="fig-side">' + side + '</aside></div>'
    + (o.foot ? '<div class="fig-foot">' + o.foot + '</div>' : '')
    + '</section>';
}
function bindPins() {
  $$('.fig').forEach(f => {
    const els = $$('.pin,.co', f);
    const set = n => els.forEach(el => el.classList.toggle('on', el.dataset.n === n));
    els.forEach(el => {
      el.addEventListener('mouseenter', () => set(el.dataset.n));
      el.addEventListener('mouseleave', () => set(null));
    });
  });
}

    const off = document.body.classList.toggle('nopin');
    bp.classList.toggle('on', !off);
    bp.textContent = off ? '显示图上标注' : '隐藏图上标注';
  };

  /* 目录滚动高亮 */
  const links = $$('#toc a');
  const targets = links.map(a => document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
  const onScroll = () => {
    const y = window.scrollY + 96;
    let cur = 0;
    targets.forEach((t, i) => { if (t.offsetTop <= y) cur = i; });
    links.forEach((a, i) => a.classList.toggle('on', targets[i] === targets[cur]));
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  console.log('DOC_READY mounts=' + ok + (bad.length ? ' FAILED=' + bad.join(' | ') : ''));
}
boot();
</script>
</body>
</html>
